name: Native source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  protocol-and-linux-client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash linux/build.sh
      - run: bash tests/run_desktop.sh
      - run: python3 tests/test_linux.py
      - run: python3 tests/test_indexed_service.py
